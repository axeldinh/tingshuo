name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Generated data is up to date
        run: |
          npm run build
          git diff --exit-code docs/ || (echo "docs/ is stale: run 'npm run build' and commit" && exit 1)
